name: Rust studio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo fmt --all --check
      - run: cargo test --locked -p forma-core -p forma-build
